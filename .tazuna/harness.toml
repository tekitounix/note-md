tazuna_sha = "f9e38bf5e5fd8b70fc31109dbf50f3bbb78f3e70"
last_sync = "2026-07-12T22:21:47+00:00"
workflow_tier = "C"
branch_strategy = "trunk"
project_type = "external"
ci_profile = "cross-platform-app"

[language]
operator_docs = "ja"
user_facing = "ja"
japanese_quality = "strict"

[language.code_comments]
scan_roots = ["scripts"]
suffixes = [".sh"]

[publication]
visibility = "public"
release_intent = "none"
md_i18n_active = false
view_layout = "subdirectory"

[workspace_visibility]
hidden_entries = [
  ".vscode",
  "**/.vscode",
  ".vscode-test",
  "**/.vscode-test",
  "dist",
  "**/dist",
  "node_modules",
  "**/node_modules",
  "out",
  "**/out",
]

[ci]
local_first = true
required_remote_checks = []
remote_state = "manual_release_only"
default_pr_lane = ["npm lint", "npm format:check", "npm typecheck", "npm test", "npm package", "diff-check"]
manual_lanes = ["ci", "release"]
release_lanes = ["release workflow_dispatch"]

[local_execution]
heavy_confirmation_required = true
cpu_limit_required = true
wrapper = "tazuna run-heavy"
default_max_parallel_jobs = 1
default_max_cores = 1
stop_on_user_complaint = true
remote_builders_allowed = false
required_confirmation_fields = [
  "command",
  "purpose",
  "cpu_limit",
  "stop_condition",
  "lightweight_alternative",
]
allowed_without_confirmation = [
  "read-only",
  "diff",
  "syntax-check",
  "targeted-unit-test",
  "nix-eval",
]
heavy_command_prefixes = [
  "bazel build",
  "bazel test",
  "cargo build --release",
  "cargo test",
  "cold-agent e2e",
  "docker build",
  "make -j",
  "nix build",
  "nix develop",
  "nix flake check",
  "nix profile install",
  "nix profile upgrade",
  "nix run",
  "npm ci",
  "npm run package",
  "npx vsce",
  "npx --no-install vsce",
  "xcodebuild",
  "xmake -j",
]

[remote_sync]
enabled = true
require_clean_worktree = true
require_upstream = true
max_ahead = 0
max_behind = 0
fail_on_diverged = true

[review]
enabled = true
monthly_usd_limit = 2.0
per_pr_usd_limit = 0.15
on_label = "review:request"
skip_path_patterns = ["package-lock.json", "dist/**", "out/**"]

[review.self]
required = true
mode = "current-agent"

[review.local_cli]
enabled = false
default_agents = ["codex"]
required_for = ["cross-cutting", "harness", "security", "tier-b-plus"]
read_only = true
output = "plans/active/<slug>/reviews/"

