tazuna_sha = "7245a11ad2255ca1308fd34a4f05dc2e7c54fcfb"
last_sync = "2026-07-08T16:32:49+00:00"
workflow_tier = "C"
branch_strategy = "dev-flow"
project_type = "external"
ci_profile = "cross-platform-app"

[language]
operator_docs = "ja"
user_facing = "ja"

[language.code_comments]
scan_roots = ["scripts"]
suffixes = [".sh"]

[publication]
visibility = "public"
release_intent = "none"
md_i18n_active = false
view_layout = "subdirectory"

[workspace_visibility]
hidden_entries = [
  ".vscode",
  "**/.vscode",
  "dist",
  "**/dist",
  "node_modules",
  "**/node_modules",
  "out",
  "**/out",
]

[ci]
local_first = true
required_remote_checks = []
remote_state = "manual_release_only"
default_pr_lane = ["npm lint", "npm format:check", "npm typecheck", "npm test", "npm package", "diff-check"]
manual_lanes = ["ci", "release"]
release_lanes = ["release workflow_dispatch"]

[local_execution]
heavy_confirmation_required = true
cpu_limit_required = true
wrapper = "ai-ops run-heavy"
default_max_parallel_jobs = 1
default_max_cores = 1
stop_on_user_complaint = true
remote_builders_allowed = false
required_confirmation_fields = [
  "command",
  "purpose",
  "cpu_limit",
  "stop_condition",
  "lightweight_alternative",
]
allowed_without_confirmation = [
  "read-only",
  "diff",
  "syntax-check",
  "targeted-unit-test",
  "nix-eval",
]
heavy_command_prefixes = [
  "nix build",
  "nix develop",
  "nix flake check",
  "nix profile install",
  "nix profile upgrade",
  "nix run",
  "cargo test",
  "cargo build --release",
  "xcodebuild",
  "bazel build",
  "bazel test",
  "docker build",
  "make -j",
  "xmake -j",
  "cold-agent e2e",
  "npm ci",
  "npm run package",
  "npx vsce",
  "npx --no-install vsce",
]

[review]
enabled = true
monthly_usd_limit = 2.0
per_pr_usd_limit = 0.15
on_label = "review:request"
skip_path_patterns = ["package-lock.json", "dist/**", "out/**"]

[harness_files]
".envrc" = "1d26c74fd25a4c3dbb09e029fc609588da499fd4af2a41c88f6316c7f8c54cf1"
"AGENTS.md" = "64945f8f9dd4418849513c2a1f026c1336292e7045be23800fa54b93c6ac81b2"
"CLAUDE.md" = "336cc4fbf19beaada7ccf9986414fa91851a8d7a07dfb3ccbe800a69eed0ab49"
"flake.nix" = "3ef39f6e6d63fee13e9737c2f9cdeeb8a8af76f197d669b2d3e0c8934d5cb310"
[review.self]
required = true
mode = "current-agent"

[review.local_cli]
enabled = false
default_agents = ["codex"]
required_for = ["cross-cutting", "harness", "security", "tier-b-plus"]
read_only = true
output = "plans/active/<slug>/reviews/"
