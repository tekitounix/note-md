name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, e.g. v0.1.0"
        required: true
        type: string
      publish_marketplace:
        description: "Publish the packaged VSIX to VS Code Marketplace"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: note-md

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix_name: ${{ steps.version.outputs.vsix_name }}
      release_sha: ${{ steps.release-ref.outputs.release_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: note-md
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve immutable release ref
        id: release-ref
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Exact release tag does not exist: $TAG" >&2
            exit 1
          }
          release_sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag is not an ancestor of origin/main" >&2
            exit 1
          }
          git checkout --detach "$release_sha"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: note-md/package-lock.json
      - name: Install local-gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "/tmp/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/$archive" \
            | sha256sum --check --strict
          tar -xzf "/tmp/$archive" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
        working-directory: .
      - run: ./scripts/check.sh

      - name: Validate tag and package version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version ($package_version) does not match tag ($version)" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix_name=note-md-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $1 == "##" && $2 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' docs/changelog.md > release-notes.md
          test -s release-notes.md

      - name: Package vsix
        run: npx --no-install vsce package -o "${{ steps.version.outputs.vsix_name }}"

      - name: Upload packaged vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.version.outputs.vsix_name }}
          path: note-md/${{ steps.version.outputs.vsix_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: note-md/${{ steps.version.outputs.vsix_name }}
          body_path: note-md/release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') || startsWith(steps.version.outputs.version, '0.') }}

  publish-marketplace:
    if: ${{ inputs.publish_marketplace }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: note-md
          ref: ${{ needs.release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: note-md/package-lock.json
      - run: npm ci
      - name: Download packaged vsix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.release.outputs.vsix_name }}
          path: note-md/release-artifacts
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT secret is required when publish_marketplace is true" >&2
            exit 1
          fi

          npx --no-install vsce publish --packagePath "release-artifacts/${{ needs.release.outputs.vsix_name }}"
