name: CI

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: note-md

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: note-md
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tekitounix/ai-ops
          path: ai-ops
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: note-md/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb
        working-directory: .
      - run: ./scripts/check.sh
